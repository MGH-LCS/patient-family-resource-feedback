name: keep-supabase-warm

# Supabase's free tier pauses a project after ~7 days with no activity, which
# would make the next caregiver's feedback submission silently fail. This
# workflow issues a trivial read against the REST API twice a week so the
# project never goes idle long enough to pause.
#
# The query returns no rows (row-level security blocks anonymous reads) but
# still executes against Postgres, which counts as activity. The anon key is
# public-by-design — it can only INSERT — so it's safe to keep in the clear.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits to
# this repo. During pre-launch (no real feedback traffic yet) that's the exact
# window this matters, so it runs now; once caregivers are submitting feedback,
# that organic traffic keeps Supabase awake on its own. If the repo sits idle
# for 60 days, re-enable this workflow from the Actions tab.

on:
  schedule:
    - cron: '17 12 * * 1,4'   # Mondays and Thursdays, 12:17 UTC (max ~3-4 day gap)
  workflow_dispatch:           # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          SUPABASE_URL="https://qaqqpnjerjjyuygjqwpf.supabase.co"
          ANON_KEY="sb_publishable_vv6cd3z8vRDlmNQPHkBtrA_NfAdmCzo"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/feedback_responses?select=id&limit=1" \
            -H "apikey: $ANON_KEY")
          echo "Supabase REST responded: HTTP $code"
          # 200 = query ran (empty result is expected under RLS). Anything else fails the run.
          test "$code" = "200"
